<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic JavaScript</title>
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <header class="header">
    <h1 class="title-1">Basic JavaScript</h1>
  </header>
  <main class="main">
    <section class="section">
      <div class="wrapper">
        <div>
          <img class="img" src="./assets/img/lamborghini.jpg" alt="Lamborghini">
        </div>
        <div>
          <h2>
            Information about the car:
          </h2>
          <span id="carInfo"></span>
            <label class="label">
              Enter a new driver name:
              <input type="text" id="carDriver" class="input">
            </label>
            <h4>The new car drivers list: <span id="carDrivers"></span></h4>
            <label class="label">
              Check if he/she is a driver:
              <input type="text" id="isDriver" class="input">
            </label>
            <h4>The answer: <span id="answer"></span></h4>
            <label class="label">
              Enter a trip distance, km:
              <input type="text" id="distance" class="input">
            </label>
            <h4>The travel expenses: <span id="travelExpenses"></span></h4>
        </div>
      </div>
    </section>
    <section class="section">
      <h2>Clock: <span id="clock"></span></h2>
        <label class="label">
          Changes the time by the specified number of seconds:
          <input type="number" id="seconds" class="input">
        </label>
        <label class="label">
          Changes the time by the specified number of minutes:
          <input type="number" id="minutes" class="input">
        </label>
        <label class="label">
          Changes the time by the specified number of hours:
          <input type="number" id="hours" class="input">
        </label>
    </section>
  </main>
  <footer class="footer">
    <p class="text">
      &#169; 2025 All Rights Reserved.
    </p>
  </footer>
  <script src="./js/objects.js"></script>
</body>
</html>
